<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Case Doc Tracker — Live Demo</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #0d1117; color: #e6edf3; }
  h1 { font-size: 1.4em; }
  input[type=text] { width: 100%; background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 8px; box-sizing: border-box; }
  .item { display: flex; align-items: center; gap: 10px; margin-top: 10px; background: #161b22; padding: 8px; border-radius: 6px; }
  .item input[type=checkbox] { width: 18px; height: 18px; flex-shrink: 0; }
  .item input[type=text] { flex: 1; }
  button { background: #238636; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 0.95em; cursor: pointer; margin-top: 12px; margin-right: 8px; }
  button.secondary { background: #30363d; }
  pre { background: #161b22; padding: 15px; border-radius: 6px; white-space: pre-wrap; margin-top: 15px; }
  .progress { margin-top: 15px; font-size: 0.9em; color: #8b949e; }
  .copied { color: #3fb950; font-size: 0.85em; margin-left: 8px; }
</style>
</head>
<body>

<h1>Case Doc Tracker — Live Demo</h1>
<p>Add document categories your case needs, check them off as collected, and generate a status report. Runs entirely in your browser — nothing is saved or uploaded.</p>

<label>Case ID</label>
<input type="text" id="caseId" value="CASE-DEMO-0001">

<div id="items">
  <div class="item"><input type="checkbox" checked><input type="text" value="Government-issued ID"></div>
  <div class="item"><input type="checkbox" checked><input type="text" value="Last 3 months account statements"></div>
  <div class="item"><input type="checkbox"><input type="text" value="Proof of address"></div>
  <div class="item"><input type="checkbox"><input type="text" value="Correspondence log"></div>
</div>

<button class="secondary" onclick="addItem()">+ Add Item</button>
<button onclick="generateReport()">Generate Report</button>
<button class="secondary" onclick="copyShareableSummary()">Copy Shareable Summary</button>
<span class="copied" id="copiedMsg" style="display:none;">Copied ✓</span>

<div class="progress" id="progress"></div>
<pre id="output"></pre>

<script>
function addItem() {
  const div = document.createElement('div');
  div.className = 'item';
  div.innerHTML = `<input type="checkbox"><input type="text" placeholder="New document category">`;
  document.getElementById('items').appendChild(div);
}

function getItems() {
  const caseId = document.getElementById('caseId').value || "CASE-DEMO";
  const rows = document.querySelectorAll('#items .item');
  const collected = [];
  const outstanding = [];

  rows.forEach(row => {
    const checked = row.querySelector('input[type=checkbox]').checked;
    const label = row.querySelector('input[type=text]').value.trim();
    if (!label) return;
    (checked ? collected : outstanding).push(label);
  });

  return { caseId, collected, outstanding };
}

function generateReport() {
  const { caseId, collected, outstanding } = getItems();

  document.getElementById('progress').textContent =
    `Progress: ${collected.length}/${collected.length + outstanding.length} collected`;

  let out = `# Documentation Status — ${caseId}\n\n`;
  out += `Generated: ${new Date().toISOString()}\n\n`;
  out += `## ✅ Collected\n`;
  out += collected.length ? collected.map(c => `- ${c}`).join('\n') : '_None yet._';
  out += `\n\n## ⬜ Outstanding\n`;
  out += outstanding.length ? outstanding.map(c => `- ${c}`).join('\n') : '_Nothing outstanding._';

  document.getElementById('output').textContent = out;
}

function copyShareableSummary() {
  const { caseId, collected, outstanding } = getItems();

  let summary = `Case ${caseId} — Documentation Status\n\n`;
  summary += `Still needed from customer:\n`;
  summary += outstanding.length ? outstanding.map(c => `- ${c}`).join('\n') : '- Nothing outstanding';
  summary += `\n\nAlready received:\n`;
  summary += collected.length ? collected.map(c => `- ${c}`).join('\n') : '- Nothing yet';

  navigator.clipboard.writeText(summary).then(() => {
    const msg = document.getElementById('copiedMsg');
    msg.style.display = 'inline';
    setTimeout(() => msg.style.display = 'none', 1500);
  });
}

generateReport();
</script>

</body>
</html>
